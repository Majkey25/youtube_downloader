name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install dependencies
        run: |
          uv venv --python ${{ matrix.python }}
          uv pip install -r requirements.txt ruff pyright
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt
            sudo apt-get -o Acquire::https::Timeout=20 -o Acquire::Retries=1 update
            sudo apt-get -o Acquire::https::Timeout=20 -o Acquire::Retries=1 install --yes --no-install-recommends ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
      - name: Check Python
        run: |
          uv run --no-project ruff check .
          uv run --no-project pyright
      - name: Test application and Gunicorn delivery
        run: uv run --no-project python -m unittest -v

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build production image
        run: docker build --tag media-downloader:ci .
      - name: Check image Deno runtime
        run: docker run --rm --network none media-downloader:ci deno --version
      - name: Test Gunicorn delivery in production image
        run: |
          docker run --rm --network none \
            --mount "type=bind,source=$GITHUB_WORKSPACE/test_gunicorn.py,target=/app/test_gunicorn.py,readonly" \
            media-downloader:ci python -m unittest -v test_gunicorn
