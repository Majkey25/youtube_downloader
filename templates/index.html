<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta
        http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' __API_BASE_URL__; object-src 'none'; base-uri 'none'; form-action 'self'"
    >
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f5f2">
    <meta name="referrer" content="no-referrer">
    <meta
        name="description"
        content="Paste a public media link and get one compatible audio or video file."
    >
    <title>Download Media — paste a public link, get one file</title>
    <link rel="icon" href="static/logo/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="static/styles.css">
    <script src="static/config.js" defer></script>
    <script src="static/app.js" defer></script>
</head>
<body>
    <a class="skip-link" href="#workspace">Skip to downloader</a>

    <header class="site-header">
        <a class="brand" href="./" aria-label="Download Media home">
            <span>Download</span><span class="brand-accent">Media</span>
        </a>
    </header>

    <main id="workspace">
        <form id="inspectForm" class="inspect-form">
            <label class="visually-hidden" for="mediaUrl">Public media URL</label>
            <output class="visually-hidden" id="pendingSource" for="mediaUrl">WAITING FOR LINK</output>
            <div class="input-row">
                <input
                    id="mediaUrl"
                    name="url"
                    type="url"
                    placeholder="https://www.youtube.com/watch?v=..."
                    autocomplete="off"
                    inputmode="url"
                    maxlength="2048"
                    spellcheck="false"
                    aria-describedby="statusAnnouncer legalNote"
                    required
                >
                <button id="analyzeButton" class="action-button" type="submit">
                    Analyze
                </button>
            </div>
        </form>

        <p id="statusRegion" class="status-line" data-tone="idle">
            <span class="status-prompt" aria-hidden="true">&gt;</span>
            <span id="statusText" aria-hidden="true"></span>
            <span
                id="statusAnnouncer"
                class="visually-hidden"
                role="status"
                aria-live="polite"
                aria-atomic="true"
            ></span>
        </p>

        <section id="inspectionPanel" class="inspection" aria-labelledby="inspectionTitle" hidden>
            <div class="inspection-heading">
                <p id="inspectionTitle" class="section-label">INSPECTION RESULT</p>
                <p id="engineLabel" class="engine-label"></p>
            </div>
            <dl class="media-facts">
                <div>
                    <dt>Source</dt>
                    <dd id="detectedSource">—</dd>
                </div>
                <div>
                    <dt>Title</dt>
                    <dd id="mediaTitle">—</dd>
                </div>
                <div>
                    <dt>Duration</dt>
                    <dd id="durationLabel">—</dd>
                </div>
            </dl>

            <div id="playlistBlock" class="playlist-block" hidden>
                <label for="playlistSelect">Choose one playlist item</label>
                <select id="playlistSelect">
                    <option value="">Select an item…</option>
                </select>
                <p id="playlistNote" class="microcopy"></p>
            </div>

            <fieldset id="outputBlock" class="output-block" hidden>
                <legend>Choose output</legend>
                <div id="outputButtons" class="output-buttons"></div>
            </fieldset>

            <div id="readyBlock" class="ready-block" hidden>
                <div>
                    <p class="section-label">FILE READY</p>
                    <p id="readyMeta" class="microcopy"></p>
                </div>
                <a
                    id="downloadAnchor"
                    class="download-link"
                    href=""
                    target="_blank"
                    rel="noopener"
                    download
                >Download file</a>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <p class="footer-meta">
            <span class="footer-credit">Made by <strong>Majkey</strong> (Matěj Teplý)</span>
            <span class="footer-links">
                <a
                    id="legalNote"
                    href="https://github.com/Majkey25/youtube_downloader/blob/main/USAGE_POLICY.md"
                    aria-label="Read the Usage rules before use"
                >Usage rules</a>
                <a href="static/privacy.html">Privacy and deletion</a>
                <a href="https://github.com/Majkey25/youtube_downloader">GitHub</a>
                <a href="https://github.com/yt-dlp/yt-dlp/blob/master/supportedsites.md">Supported sites</a>
            </span>
        </p>
    </footer>
</body>
</html>
